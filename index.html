<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17211b"><link rel="manifest" href="manifest.json"><title>Product Catalogue</title>
<style>
:root{--ink:#17211b;--muted:#66736b;--line:#d8dfda;--paper:#f7f9f7;--accent:#245b40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}header{background:var(--ink);color:white;padding:16px;position:sticky;top:0;z-index:2}.top,.toolbar,.actions,.controls,nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:750;font-size:20px}.sub,.hint,.count{font-size:12px;color:var(--muted)}.sub{color:#cbd6ce;margin-top:3px}button{border:0;border-radius:9px;padding:10px 12px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:white}.secondary{background:#edf2ee;color:var(--ink);border:1px solid var(--line)}.danger{background:#a52d2d}.controls{margin-top:13px}.controls input{flex:1;min-width:0}input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;background:white;color:var(--ink)}textarea{min-height:70px}main{max-width:950px;margin:auto;padding:14px}.toolbar{margin:2px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.product{border:1px solid #cbd4cd;background:white;border-radius:4px;padding:5px;min-width:0;text-align:left;color:var(--ink);font-weight:400}.photo{width:100%;aspect-ratio:1;background:#eef2ee;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#7b887f;font-size:10px}.photo img{width:100%;height:100%;object-fit:cover}.pname{font-size:clamp(10px,2.6vw,14px);font-weight:650;margin-top:5px;overflow-wrap:anywhere;line-height:1.25;min-height:2.4em}.price{font-size:11px;color:var(--muted);margin-top:3px}.empty{padding:28px 10px;text-align:center;color:var(--muted);grid-column:1/-1}.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}.panel{background:var(--paper);width:100%;max-width:620px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 14px;font-size:21px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.actions{margin-top:15px}.actions button{flex:1}.detail-photo{width:100%;max-height:250px;object-fit:contain;background:#eef2ee;border:1px solid var(--line);border-radius:10px}.detail-row{padding:10px 0;border-bottom:1px solid var(--line)}.detail-row b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.hint{line-height:1.45}@media(min-width:650px){.overlay{align-items:center;padding:20px}.panel{border-radius:16px}.grid{gap:12px}}
</style></head><body>
<header><div class="top"><div><div class="brand" id="brand">Product Catalogue</div><div class="sub" id="subtitle">Offline product list • Marathi + English</div></div><button class="secondary" id="langBtn">मराठी</button></div><div class="controls"><input id="search" placeholder="Search products…"><button id="addBtn">＋ Add</button></div></header>
<main><div class="toolbar"><span class="count" id="count">0 products</span><button class="secondary" id="exportBtn">Export backup</button></div><section class="grid" id="grid"></section><nav><button class="secondary" id="prevBtn">←</button><span class="count" id="pageLabel">Page 1</span><button class="secondary" id="nextBtn">→</button></nav><p class="hint" id="offlineHint">Products are saved on this device. Export a backup before changing phones or clearing browser data.</p><div class="field"><label id="importLabel" for="importFile">Import backup (JSON)</label><input id="importFile" type="file" accept=".json,application/json"></div></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<script>
const KEY='offlineProductCatalogue_v1';let products=[],page=0,lang='en';const $=id=>document.getElementById(id);const tr={en:{brand:'Product Catalogue',subtitle:'Offline product list • Marathi + English',search:'Search products…',add:'＋ Add',count:n=>`${n} product${n===1?'':'s'}`,page:n=>`Page ${n}`,empty:'No products yet. Tap “＋ Add” to create one.',noPhoto:'No photo',price:'Rate / Price (₹)',name:'Product name',unit:'Unit / Measure',ingredients:'Ingredients',details:'Full details',photo:'Product photo',save:'Save product',cancel:'Cancel',edit:'Edit',del:'Delete',close:'Close',confirm:'Delete this product?',export:'Export backup',offline:'Products are saved on this device. Export a backup before changing phones or clearing browser data.',import:'Import backup (JSON)',notFound:'No matching products',language:'मराठी'},mr:{brand:'प्रॉडक्ट कॅटलॉग',subtitle:'ऑफलाइन प्रॉडक्ट यादी • मराठी + English',search:'प्रॉडक्ट शोधा…',add:'＋ नवीन',count:n=>`${n} प्रॉडक्ट`,page:n=>`पान ${n}`,empty:'अजून प्रॉडक्ट नाहीत. पहिला प्रॉडक्ट जोडण्यासाठी “＋ नवीन” दाबा.',noPhoto:'फोटो नाही',price:'रेट / किंमत (₹)',name:'प्रॉडक्टचे नाव',unit:'माप / युनिट',ingredients:'साहित्य / Ingredients',details:'संपूर्ण माहिती',photo:'प्रॉडक्टचा फोटो',save:'सेव्ह करा',cancel:'रद्द करा',edit:'एडिट',del:'डिलीट',close:'बंद करा',confirm:'हा प्रॉडक्ट डिलीट करायचा?',export:'बॅकअप Export',offline:'प्रॉडक्ट या डिव्हाइसवर सेव्ह होतात. फोन बदलण्यापूर्वी किंवा ब्राउझर डेटा पुसण्यापूर्वी बॅकअप घ्या.',import:'बॅकअप Import (JSON)',notFound:'प्रॉडक्ट सापडला नाही',language:'English'}};function T(k,...a){let v=tr[lang][k];return typeof v==='function'?v(...a):v}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{products=[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(products))}
function render(){for(const [id,key] of [['brand','brand'],['subtitle','subtitle'],['exportBtn','export'],['offlineHint','offline'],['importLabel','import'],['langBtn','language'],['addBtn','add']])$(id).textContent=T(key);$('search').placeholder=T('search');let q=$('search').value.trim().toLowerCase(),filtered=products.filter(p=>[p.name,p.ingredients,p.details].some(v=>(v||'').toLowerCase().includes(q)));let pages=Math.max(1,Math.ceil(filtered.length/16));page=Math.min(page,pages-1);$('count').textContent=T('count',filtered.length);$('pageLabel').textContent=T('page',page+1);$('prevBtn').disabled=page===0;$('nextBtn').disabled=page>=pages-1;let shown=filtered.slice(page*16,page*16+16);$('grid').innerHTML=shown.length?shown.map(p=>`<button class="product" data-id="${p.id}"><div class="photo">${p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`:T('noPhoto')}</div><div class="pname">${esc(p.name)}</div><div class="price">${p.price!==''&&p.price!=null?'₹'+esc(p.price):''}</div></button>`).join(''):`<div class="empty">${filtered.length?T('empty'):T('notFound')}</div>`;$('grid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id))}
function open(html){$('panel').innerHTML=html;$('overlay').style.display='flex'}function close(){$('overlay').style.display='none'}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function form(id=null){let p=products.find(x=>x.id===id)||{name:'',price:'',unit:'',ingredients:'',details:'',photo:''};open(`<h2>${id?T('edit'):T('add')}</h2><form id="pf"><div class="field"><label>${T('name')} *</label><input name="name" required maxlength="100" value="${esc(p.name)}"></div><div class="field"><label>${T('price')}</label><input name="price" type="number" min="0" step="0.01" value="${esc(p.price)}"></div><div class="field"><label>${T('unit')}</label><input name="unit" value="${esc(p.unit)}" placeholder="kg, piece, pack"></div><div class="field"><label>${T('ingredients')}</label><textarea name="ingredients">${esc(p.ingredients)}</textarea></div><div class="field"><label>${T('details')}</label><textarea name="details">${esc(p.details)}</textarea></div><div class="field"><label>${T('photo')}</label><input name="photoFile" type="file" accept="image/*"><p class="hint">${p.photo?'A photo is already saved. Choose another to replace it.':'Choose a photo from your device. Keep it under 1.5 MB.'}</p></div><div class="actions"><button>${T('save')}</button><button type="button" class="secondary" id="cancel">${T('cancel')}</button></div></form>`);$('cancel').onclick=close;$('pf').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,file=f.photoFile.files[0],photo=p.photo||'';if(file){if(file.size>1500000){alert('Choose a photo under 1.5 MB.');return}photo=await readFile(file)}let item={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),name:f.name.value.trim(),price:f.price.value,unit:f.unit.value.trim(),ingredients:f.ingredients.value.trim(),details:f.details.value.trim(),photo};if(id)products=products.map(x=>x.id===id?item:x);else products.unshift(item);try{persist()}catch{alert('Storage is full. Try a smaller photo.');return}close();render()}}
function detail(id){let p=products.find(x=>x.id===id);if(!p)return;open(`<h2>${esc(p.name)}</h2>${p.photo?`<img class="detail-photo" src="${p.photo}" alt="${esc(p.name)}">`:''}<div class="detail-row"><b>${T('price')}</b>${p.price!==''?'₹'+esc(p.price):'—'}</div><div class="detail-row"><b>${T('unit')}</b>${esc(p.unit||'—')}</div><div class="detail-row"><b>${T('ingredients')}</b>${esc(p.ingredients||'—').replace(/\n/g,'<br>')}</div><div class="detail-row"><b>${T('details')}</b>${esc(p.details||'—').replace(/\n/g,'<br>')}</div><div class="actions"><button id="edit">${T('edit')}</button><button class="danger" id="delete">${T('del')}</button><button class="secondary" id="close">${T('close')}</button></div>`);$('edit').onclick=()=>form(id);$('close').onclick=close;$('delete').onclick=()=>{if(confirm(T('confirm'))){products=products.filter(x=>x.id!==id);persist();close();render()}}}
$('addBtn').onclick=()=>form();$('search').oninput=()=>{page=0;render()};$('prevBtn').onclick=()=>{page--;render()};$('nextBtn').onclick=()=>{page++;render()};$('langBtn').onclick=()=>{lang=lang==='en'?'mr':'en';render()};$('exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(products,null,2)],{type:'application/json'}));a.download='product-catalogue-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(p=>p&&p.id&&p.name))throw 0;if(confirm('Import will replace the current list. Continue?')){products=data;persist();page=0;render()}}catch{alert('Invalid backup file')}e.target.value=''};$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};load();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
