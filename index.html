<script>
(()=>{'use strict';const PK='offlineProductCatalogue_v1',OK='sarvadnyaMedicoOrders_v1',CK='sarvadnyaMedicoCustomers_v1';const $=s=>document.querySelector(s),main=$('#main'),modal=$('#modal'),fab=$('#fab');let page='products',query='',category='All',sort='name',cart={},editPid=null,editOid=null;const load=(k,d)=>{try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch{return d}},save=()=>{localStorage.setItem(PK,JSON.stringify(products));localStorage.setItem(OK,JSON.stringify(orders));localStorage.setItem(CK,JSON.stringify(customers))},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10),datefmt=d=>{let x=new Date((d||today())+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};const pname=p=>p.name||p.productName||p.title||'Unnamed product',pcat=p=>p.category||p.type||'Generic',photo=p=>p.photo||p.image||p.imageData||p.img||'',price=p=>p.price??p.rate??p.mrp??'';let products=load(PK,[]).map(p=>({...p,id:p.id||p._id||uid(),name:pname(p),category:pcat(p),price:price(p),unit:p.unit||'pcs',ingredients:p.ingredients||'',details:p.details||p.description||'',photo:photo(p)})),orders=load(OK,[]).map(o=>({...o,id:o.id||uid(),date:o.date||today(),items:Array.isArray(o.items)?o.items:[]})),customers=load(CK,[]);save();$('#date').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));fab.classList.toggle('hidden',page!=='products');updateCartBar();({products:renderProducts,history:renderHistory,customers:renderCustomers,tools:renderTools}[page]||renderProducts)()}function updateCartBar(){let entries=Object.entries(cart).filter(([id,q])=>q>0&&products.some(p=>p.id===id)),count=entries.reduce((n,[id,q])=>n+Number(q),0),bar=$('#cartbar');bar.classList.toggle('hidden',page!=='products'||count===0);$('#cartcount').textContent=`Cart · ${count} item${count===1?'':'s'}`;$('#cartdesc').textContent=`${entries.length} different product${entries.length===1?'':'s'}`}
function renderProducts(){let cats=['All',...new Set(products.map(pcat))],list=products.filter(p=>(category==='All'||pcat(p).toLowerCase()===category.toLowerCase())&&[pname(p),p.ingredients,p.details,pcat(p)].join(' ').toLowerCase().includes(query.toLowerCase()));list.sort((a,b)=>sort==='name'?pname(a).localeCompare(pname(b)):Number(b.updatedAt||b.createdAt||0)-Number(a.updatedAt||a.createdAt||0));main.innerHTML=`<div class="toolbar"><input id="search" placeholder="⌕  Search products..." value="${esc(query)}"><button class="btn small" id="sort">${sort==='name'?'A–Z':'Recent'}</button></div><div class="filters">${cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="head"><h2>Product Catalogue</h2><span class="mini">${list.length} products</span></div>${list.length?`<div class="grid">${list.map(p=>`<article class="product"><div class="photo">${photo(p)?`<img src="${esc(photo(p))}" alt="" onerror="this.parentElement.innerHTML='✚'">`:'✚'}</div><div class="pname">${esc(pname(p))}</div><div class="pmeta">${esc(pcat(p))}${price(p)!==''?' · ₹'+esc(price(p)):''}</div><div class="actions"><button class="btn primary" data-order="${esc(p.id)}">${cart[p.id]>0?"✓ In Cart":"+ Add"}</button><button class="iconbtn" data-edit="${esc(p.id)}">✎</button></div></article>`).join('')}</div>`:`<div class="empty">${products.length?'No matching products found.':'No products yet. Tap + to add your first product.'}</div>`}`;$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;renderProducts();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#sort').onclick=()=>{sort=sort==='name'?'recent':'name';renderProducts()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderProducts()});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(!cart[b.dataset.order])cart[b.dataset.order]=1;updateCartBar();renderProducts()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productForm(b.dataset.edit))}
function open(title,body){modal.innerHTML=`<div class="modalbg" id="bg"><section class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" id="close">×</button></div>${body}</section></div>`;$('#close').onclick=close;$('#bg').onclick=e=>{if(e.target.id==='bg')close()}}function close(){modal.innerHTML=''}
function imageData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas'),s=Math.min(1,700/Math.max(im.width,im.height));cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.78))};im.onerror=()=>resolve(String(r.result));im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function productForm(pid){editPid=pid||null;let p=products.find(x=>x.id===pid)||{name:'',category:'Generic',price:'',unit:'pcs',ingredients:'',details:'',photo:''};open(pid?'Edit product':'Add product',`<form id="pf"><div class="field"><label>Product name *</label><input name="name" required value="${esc(p.name)}" placeholder="Product name"></div><div class="formgrid"><div class="field"><label>Category</label><select name="category">${['Generic','Injectable','Surgical','Other'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Rate (₹)</label><input name="price" type="number" min="0" step=".01" value="${esc(p.price)}"></div></div><div class="formgrid"><div class="field"><label>Unit</label><input name="unit" value="${esc(p.unit)}" placeholder="pcs / box"></div><div class="field"><label>Product photo (optional)</label><input name="file" type="file" accept="image/*"><div class="sub">Choose from Photos, Files, or Camera when your iPhone offers the options.</div></div></div><div class="field"><label>Ingredients</label><input name="ingredients" value="${esc(p.ingredients)}"></div><div class="field"><label>Product details</label><textarea name="details" rows="2">${esc(p.details)}</textarea></div><p class="note">Product information is stored on this device. Export a backup regularly.</p><div class="formactions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save product</button></div>${pid?'<hr><button type="button" class="btn red" id="delp" style="width:100%">Delete product</button>':''}</form>`);$('#cancel').onclick=close;$('#pf').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,fd=new FormData(f),ph=p.photo||'';if(f.elements.file.files[0]){try{ph=await imageData(f.elements.file.files[0])}catch(err){alert('Photo could not be read. Please try another image.');return}}let obj={...p,id:p.id||uid(),name:String(fd.get('name')).trim(),category:String(fd.get('category')),price:String(fd.get('price')||''),unit:String(fd.get('unit')||'pcs').trim(),ingredients:String(fd.get('ingredients')||'').trim(),details:String(fd.get('details')||'').trim(),photo:ph,updatedAt:Date.now()};if(editPid)products=products.map(x=>x.id===editPid?obj:x);else{obj.createdAt=Date.now();products.unshift(obj)}save();close();renderProducts()};if(pid)$('#delp').onclick=()=>{if(confirm('Delete this product?')){products=products.filter(x=>x.id!==pid);delete cart[pid];save();close();renderProducts()}}}
function orderModal(existing=null,selectedCustomerId='',preserve=false){if(!preserve){editOid=existing?.id||null;if(existing){cart={};existing.items.forEach(i=>{let id=i.productId;if(!products.some(p=>p.id===id))id=products.find(p=>pname(p)===i.name)?.id;if(id)cart[id]=(cart[id]||0)+Number(i.qty||1)})}}renderOrderModal(existing,selectedCustomerId,existing?.note||'')}
function renderOrderModal(existing=null,selectedCustomerId='',noteValue='',customerText=''){let items=Object.entries(cart).filter(([id,q])=>q>0&&products.some(p=>p.id===id));let selectedCustomer=customers.find(c=>c.id===(selectedCustomerId||existing?.customerId||''));if(!customerText&&selectedCustomer)customerText=selectedCustomer.shopName;open(existing?'Edit order':'Cart / New order',`<div id="oc">${items.length?items.map(([id,q])=>{let p=products.find(p=>p.id===id);return `<div class="cartitem"><div><div class="title">${esc(pname(p))}</div><div class="sub">${esc(pcat(p))}</div><button class="iconbtn" style="margin-top:6px" data-remove="${esc(id)}">Remove</button></div><div class="qtyrow"><button type="button" class="qtybtn" data-minus="${esc(id)}">−</button><input class="qtynum" type="number" inputmode="numeric" min="1" data-qty="${esc(id)}" value="${q}"><button type="button" class="qtybtn" data-plus="${esc(id)}">+</button></div></div>`}).join(''):'<div class="empty">Cart is empty. Close this window and add products first.</div>'}<hr><div class="field"><label>Search customer (optional)</label><input id="ocustomerSearch" autocomplete="off" placeholder="Type shop name..." value="${esc(customerText)}"><input type="hidden" id="ocustomer" value="${esc(selectedCustomer?.id||'')}"><div id="customerMatches" class="hidden" style="margin-top:5px;border:1px solid #dfe7e0;border-radius:10px;background:#fff;overflow:hidden"></div><div class="sub">Type the beginning of the shop name to see matching customers.</div><button type="button" class="btn small" id="addCustomerFromOrder" style="margin-top:7px">+ Add new customer</button><button type="button" class="btn small" id="clearCustomer" style="margin-top:7px">Clear selection</button></div><div class="field"><label>Order note (optional)</label><textarea id="onote" rows="2" placeholder="One note for the whole order">${esc(noteValue)}</textarea></div><p class="note">Order slip shows customer, product names, quantities and note only function redraw(){let c=$('#ocustomer').value,n=$('#onote').value,t=$('#ocustomerSearch').value;renderOrderModal(existing,c,n,t)}
function showCustomerMatches(){let inp=$('#ocustomerSearch'),box=$('#customerMatches'),term=inp.value.trim().toLocaleLowerCase();$('#ocustomer').value='';if(!term){box.classList.add('hidden');box.innerHTML='';return}let matches=customers.filter(c=>(c.shopName||'').toLocaleLowerCase().startsWith(term));box.innerHTML=matches.map(c=>`<button type="button" data-pickcustomer="${esc(c.id)}" style="display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #edf1ed;background:#fff;color:#24362d"><b>${esc(c.shopName)}</b>${c.mobile?`<div class="sub">${esc(c.mobile)}</div>`:''}</button>`).join('')+(matches.length?'':'<div style="padding:10px 12px;font-size:12px;color:#708176">No matching customer</div>');box.classList.remove('hidden');box.querySelectorAll('[data-pickcustomer]').forEach(b=>b.onclick=()=>{let c=customers.find(x=>x.id===b.dataset.pickcustomer);if(c){$('#ocustomer').value=c.id;inp.value=c.shopName;box.classList.add('hidden');box.innerHTML=''}})}
$('#ocustomerSearch').oninput=showCustomerMatches;$('#ocustomerSearch').onfocus=()=>{if($('#ocustomerSearch').value.trim())showCustomerMatches()};$('#clearCustomer').onclick=()=>{$('#ocustomer').value='';$('#ocustomerSearch').value='';$('#customerMatches').classList.add('hidden')};$('#addCustomerFromOrder').onclick=()=>{let n=$('#onote').value;customerForm(null,newId=>{let c=customers.find(x=>x.id===newId);renderOrderModal(existing,newId,n,c?.shopName||'')})};
document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{cart[b.dataset.minus]=Math.max(1,(cart[b.dataset.minus]||1)-1);redraw()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[b.dataset.plus]=(cart[b.dataset.plus]||0)+1;redraw()});document.querySelectorAll('[data-qty]').forEach(b=>b.onchange=()=>{cart[b.dataset.qty]=Math.max(1,parseInt(b.value||'1',10));redraw()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];redraw()});$('#saveOrder').onclick=()=>{let c=customers.find(x=>x.id===$('#ocustomer').value),its=Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>{let p=products.find(p=>p.id===id);return p?{productId:id,name:pname(p),qty:q,unit:p.unit||'pcs'}:null}).filter(Boolean);if(!its.length)return;let o={id:editOid||uid(),date:existing?.date||today(),updatedAt:Date.now(),customerId:c?.id||'',customerName:c?.shopName||'',customerMobile:c?.mobile||'',note:$('#onote').value.trim(),items:its};if(editOid)orders=orders.map(x=>x.id===editOid?o:x);else orders.unshift(o);save();cart={};editOid=null;close();page=existing?'history':'products';query='';render();if(!existing)alert('Order placed successfully. Cart is now empty.')}
}
function renderHistory(){let list=[...orders].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||0)-(a.updatedAt||0)).filter(o=>(o.date+' '+o.customerName+' '+o.customerMobile).toLowerCase().includes(query.toLowerCase()));main.innerHTML=`<div class="head"><h2>Order History</h2><span class="mini">${orders.length} orders</span></div><div class="toolbar"><input id="hs" placeholder="Search date or customer..." value="${esc(query)}"></div>${list.length?list.map(o=>`<article class="card"><div class="row"><div><div class="title">${esc(o.customerName||'Customer not selected')}</div><div class="sub">${datefmt(o.date)} · ${o.items.length} product${o.items.length===1?'':'s'}${o.customerMobile?' · '+esc(o.customerMobile):''}</div></div><button class="iconbtn" data-view="${esc(o.id)}">View ›</button></div></article>`).join(''):'<div class="empty">No saved orders yet. Add products to an order from Products.</div>'}`;$('#hs').oninput=e=>{query=e.target.value;const p=e.target.selectionStart;renderHistory();$('#hs').focus();$('#hs').setSelectionRange(p,p)};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showOrder(b.dataset.view))}
function showOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;open('Order details',`<div class="panel"><div class="row"><div class="title">${esc(o.customerName||'Customer not selected')}</div><span class="badge">${datefmt(o.date)}</span></div>${o.customerMobile?`<div class="sub">Mobile: ${esc(o.customerMobile)}</div>`:''}<div class="orderlines">${o.items.map(i=>`${esc(i.name)}  ×  ${esc(i.qty)} ${esc(i.unit||'')}`).join('\n')}</div>${o.note?`<hr><div class="note"><b>Note:</b> ${esc(o.note)}</div>`:''}</div><div class="formactions"><button class="btn" id="repeat">Repeat order</button><button class="btn primary" id="editorder">Edit order</button></div><div class="formactions"><button class="btn red" id="deleteorder">Delete order</button></div>`);$('#repeat').onclick=()=>{cart={};o.items.forEach(i=>{let p=products.find(p=>p.id===i.productId)||products.find(p=>pname(p)===i.name);if(p)cart[p.id]=(cart[p.id]||0)+Number(i.qty||1)});close();orderModal()};$('#editorder').onclick=()=>{close();orderModal(o)};$('#deleteorder').onclick=()=>{if(confirm('Delete this order permanently?')){orders=orders.filter(x=>x.id!==id);save();close();renderHistory()}}}
function customerForm(cid,after){let c=customers.find(x=>x.id===cid)||{shopName:'',mobile:''};open(cid?'Edit customer':'Add customer',`<form id="cf"><div class="field"><label>Shop name *</label><input name="shop" required value="${esc(c.shopName)}" placeholder="Customer shop name"></div><div class="field"><label>Mobile number</label><input name="mobile" inputmode="tel" value="${esc(c.mobile)}" placeholder="Optional"></div><div class="formactions"><button type="button" class="btn" id="ccancel">Cancel</button><button class="btn primary">Save customer</button></div></form>`);$('#ccancel').onclick=close;$('#cf').onsubmit=e=>{e.preventDefault();let shopName=e.currentTarget.elements.shop.value.trim(),mobile=e.currentTarget.elements.mobile.value.trim();let savedId=cid;if(cid)customers=customers.map(x=>x.id===cid?{...x,shopName,mobile}:x);else{savedId=uid();customers.unshift({id:savedId,shopName,mobile})}save();close();if(after)after(savedId);else renderCustomers()}}
function renderCustomers(){main.innerHTML=`<div class="head"><h2>Customers</h2><button class="btn primary small" id="addc">+ Add</button></div>${customers.length?customers.map(c=>`<article class="card"><div class="row"><div><div class="title">${esc(c.shopName)}</div><div class="sub">${esc(c.mobile||'No mobile number')} · ${orders.filter(o=>o.customerId===c.id).length} orders</div></div><button class="iconbtn" data-cedit="${esc(c.id)}">✎</button></div></article>`).join(''):'<div class="empty">Customers are optional. Add a shop name and mobile number when useful.</div>'}`;$('#addc').onclick=()=>customerForm();document.querySelectorAll('[data-cedit]').forEach(b=>b.onclick=()=>customerForm(b.dataset.cedit))}
function renderTools(){main.innerHTML=`<div class="head"><h2>Tools</h2><span class="mini">Offline & backup</span></div><div class="panel"><h3>Backup & Restore</h3><p class="note">Save products, customer list and order history in a JSON backup file.</p><div class="toolsgrid"><button class="btn" id="export">⬇ Export backup</button><button class="btn" id="import">⬆ Restore backup</button></div></div><div class="panel"><h3>Quick information</h3><div class="row"><span class="mini">Products saved</span><b>${products.length}</b></div><hr><div class="row"><span class="mini">Customers saved</span><b>${customers.length}</b></div><hr><div class="row"><span class="mini">Orders saved</span><b>${orders.length}</b></div></div><div class="panel"><h3>Offline app</h3><p class="note">Information is stored in this browser on this device. Export a backup before clearing website data or changing devices.</p></div>`;$('#export').onclick=exportBackup;$('#import').onclick=()=>$('#importfile').click()}
function exportBackup(){let blob=new Blob([JSON.stringify({app:'SARVADNYA MEDICO',version:1,exportedAt:new Date().toISOString(),products,customers,orders},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sarvadnya-medico-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('#importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.products))throw Error();if(!confirm('Restore backup? Current products, customers and orders will be replaced.'))return;products=d.products.map(p=>({...p,id:p.id||uid(),name:pname(p),category:pcat(p),price:price(p),unit:p.unit||'pcs',photo:photo(p)}));customers=Array.isArray(d.customers)?d.customers:[];orders=Array.isArray(d.orders)?d.orders:[];save();alert('Backup restored.');page='products';render()}catch{alert('Invalid backup file. Select a SARVADNYA MEDICO JSON backup.')}finally{e.target.value=''}};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});fab.onclick=()=>productForm();$('#reviewcart').onclick=()=>orderModal();render();})();
</script></body></html>
